<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CantuPneus | Image Bar (Dengage panel content)</title>
<!-- =====================================================================
     CANTUPNEUS IMAGE BAR, On-Site content for the panel

     Paste this WHOLE file into the "image-bar" scenario editor. All CSS is
     scoped to #cantu-imgbar, so nothing leaks onto the page. The image uses an
     absolute site URL so it also loads in the panel preview.

     Clicks: the engine renders this content inside a cross-origin iframe, so it
     only counts a click when the content calls Dn.sendClick(buttonId). The CTA
     reports; the close control calls Dn.close() instead, so a dismissal never
     inflates CLICK, UNIQUE CLICK or CTR.

     Links: target="_top" so navigation leaves the iframe.

     WIDTH: use the panel's BANNER layout (not Popup). The banner container is
     already fixed and full width; the bar just fills 100% of it.

     Panel settings:
       - Scenario: triggerBy = DATA_LAYER_EVENT, eventName = image-bar
       - Layout: Banner, Position = Bottom,
         "Keep this message in place on scroll" ON
       - Design: padding 0, transparent background
====================================================================== -->
</head>
<body>

<div id="cantu-imgbar">
  <style>
    #cantu-imgbar *{margin:0;padding:0;box-sizing:border-box;}
    #cantu-imgbar{
      --ib-purple:#4E018F; --ib-purple-dark:#35015F; --ib-yellow:#FFE958; --ib-ink:#1A1030;
      font-family:Inter,-apple-system,'Segoe UI',Roboto,sans-serif;width:100%;
    }
    #cantu-imgbar .ib-vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;}
    #cantu-imgbar #ib-hide:checked ~ .ib-strip{display:none;}

    /* in normal flow: the Banner layout container is already fixed and full
       width, so the bar only has to fill 100% of it */
    #cantu-imgbar .ib-strip{
      width:100%;position:relative;
      display:flex;align-items:center;gap:16px;
      background:linear-gradient(100deg,var(--ib-purple) 0%,var(--ib-purple-dark) 100%);
      color:#fff;padding:0 52px 0 0;overflow:hidden;
      box-shadow:0 -6px 18px rgba(26,16,48,.22);animation:ib-in .3s ease-out;
    }
    @keyframes ib-in{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

    #cantu-imgbar .ib-photo{
      width:132px;height:76px;object-fit:cover;flex-shrink:0;display:block;
      -webkit-mask-image:linear-gradient(to right,#000 62%,transparent);
      mask-image:linear-gradient(to right,#000 62%,transparent);
    }
    #cantu-imgbar .ib-copy{flex:1;min-width:0;padding:12px 0;}
    #cantu-imgbar .ib-title{
      font-family:'Barlow Condensed',Impact,sans-serif;font-weight:600;font-size:20px;
      letter-spacing:.02em;line-height:1.15;
    }
    #cantu-imgbar .ib-title em{font-style:normal;color:var(--ib-yellow);}
    #cantu-imgbar .ib-sub{font-size:12px;opacity:.85;margin-top:2px;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    #cantu-imgbar .ib-cta{
      flex-shrink:0;background:var(--ib-yellow);color:var(--ib-purple-dark);text-decoration:none;
      font:700 12px Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;
      padding:10px 18px;border-radius:10px;transition:all .2s ease;
    }
    #cantu-imgbar .ib-cta:hover{background:#fff;color:var(--ib-purple);transform:translateY(-1px);}
    #cantu-imgbar .ib-close{
      position:absolute;top:50%;right:12px;transform:translateY(-50%);
      width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.16);
      color:#fff;font-size:14px;line-height:28px;text-align:center;cursor:pointer;
      transition:background .2s;
    }
    #cantu-imgbar .ib-close:hover{background:rgba(255,255,255,.3);}

    @media (max-width:640px){
      #cantu-imgbar .ib-photo{width:84px;height:88px;}
      #cantu-imgbar .ib-title{font-size:17px;}
      #cantu-imgbar .ib-sub{white-space:normal;}
      #cantu-imgbar .ib-strip{gap:10px;padding-right:46px;}
      #cantu-imgbar .ib-cta{padding:9px 12px;}
    }
  </style>

  <input type="checkbox" id="ib-hide" class="ib-vh">
  <div class="ib-strip" role="region" aria-label="CantuPneus ready stock">
    <img class="ib-photo" alt="CantuPneus tyre warehouse"
      src="https://salil-dengage.github.io/dengage-demos/cantu-pneus/en/images/scenes/operacao-estoque.jpg">
    <div class="ib-copy">
      <p class="ib-title">Ready stock: <em>12,000 tyres</em> on the shelf</p>
      <p class="ib-sub">Truck, passenger, agricultural and OTR. Invoiced within 24h for registered businesses.</p>
    </div>
    <a target="_top" class="ib-cta" onclick="Dn.sendClick('image-bar__view-stock')" href="https://salil-dengage.github.io/dengage-demos/cantu-pneus/en/index.html#products">View stock</a>
    <label class="ib-close" for="ib-hide" onclick="Dn.close()" role="button" aria-label="Close bar">&#10005;</label>
  </div>
</div>

</body>
</html>
