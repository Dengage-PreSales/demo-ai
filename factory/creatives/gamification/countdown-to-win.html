<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo Factory | Countdown to win (Dengage panel content)</title>
<!-- =========================================================================
     ONE OF THE SHARED CREATIVES. Paste the whole file into the campaign
     whose trigger name is:

         dengage_demo_countdown-to-win

     ===================================================================
     IT FOLLOWS THE PANEL'S OWN COUNTDOWN TEMPLATE ON PURPOSE
     ===================================================================

     Rebuilt 7 August 2026 against a screenshot of the stock template, because a
     creative that a prospect will compare against Dengage's own builder should look
     like the same product rather than like a different one. What the reference does
     and this keeps:

       a centred title in title case, not upper case
       a centred two line body under it
       a single soft grey panel holding the clock
       three number groups, hours minutes seconds, split by colons
       the number large and dark, the unit label small and quiet beneath it
       one button, centred and sized to its text rather than full width

     WHAT IS DELIBERATELY BETTER RATHER THAN THE SAME:

       tabular figures, so the seconds do not shuffle the colons sideways as digits
         change width. On the stock template they move
       the colons sit on the numbers' optical centre rather than the block's, which is
         what stops them looking like they belong to the unit labels
       the panel and the button take the demo's theme, which the stock one cannot
       the expired state exists at all

     WHAT IT DOES NOT COPY. The reference's button reads "Order Now", and a button
     here reports and dismisses rather than navigating (handoff 6.3), so a label
     promising an order would be describing something this does not do.

     TEN MINUTES, NOT AN HOUR. The reference shows 01:09:47. An hour long clock cannot
     be shown expiring inside a call, and the expiry is the mechanic, so this starts at
     ten minutes and still renders in the reference's hours-minutes-seconds shape.

     ===================================================================
     WHY THE TIMER STARTS FROM AN IMAGE
     ===================================================================

     A countdown has to tick, ticking needs a timer, and the panel strips <script> on
     save. The other two games hang their logic on onclick, which survives, but a clock
     has no click to hang off. So the interval starts from onload on a zero size image,
     the same mechanism the theme bootstrap below uses.

     ONE INTERVAL, AND IT IS ALWAYS CLEARED: at zero, and on a claim. One left running
     inside a dismissed creative keeps a dead iframe alive and keeps writing into a
     card nobody is looking at. It stops when the draw is ASKED rather than when it
     answers, because a clock still ticking behind a revealed prize looks like a fault.

     ===================================================================
     THE GAME CONTRACT, SHARED WITH THE OTHER TWO
     ===================================================================

     Dn.getGameWinner() posts to the parent, which calls the coupon draw endpoint, and
     REJECTS AFTER THREE SECONDS if no game or coupon is configured in the panel. So
     there is a .catch showing a plain fallback rather than a card that never resolves.
     The prize text comes from the server and is read defensively, which is also what
     keeps this creative shareable: the offer is configured per campaign, so one file
     serves every demo without naming a discount.
     factory/creatives/gamification/README.md.

     FOUR STATES, driven by an attribute because that is how state works with no script
     block: ready, won, sorry, and expired. Expired keeps the clock on screen at zero
     with everything gone quiet, because a countdown that vanishes when it runs out
     never shows what expiring looks like.

     WHAT THIS FILE MAY NOT SAY: no brand, no product, no price, no currency, no
     vertical. One campaign serves every demo forever.

     PANEL SETTINGS, handoff 2.2:

       Trigger              Data Layer Event
       Event name           dengage_demo_countdown-to-win
       Where to display     /.*/
       Status               Active
       Show every X minutes 1
       Max show count       100
       Layout               Popup, width 440 to 480
       Design               padding 0, transparent background
       Close button         Layout > Close Button > "Add close button to outside"
       Game                 configure the coupon draw, or every run lands in `sorry`

     NO SCRIPT TAG. CSS scoped under #dnf-cd.
========================================================================== -->
</head>
<body>

<div id="dnf-cd">
  <style>
    #dnf-cd * { margin:0; padding:0; box-sizing:border-box; }
    /* THE NEUTRAL PALETTE, AND THE ONLY PLACE A COLOUR IS WRITTEN DOWN. The bootstrap
       below overwrites these same names when the page answers with a theme.
       --c-brand-text is the brand colour made safe to use as text or as a graphic on
       the card, derived in template/js/boot.js: never use --c-primary for either,
       because a pale brand measures as low as 1.12:1 against white. */
    #dnf-cd {
      --c-primary:#125cfa; --c-on-primary:#ffffff; --c-brand-text:#125cfa;
      --c-ink:#14181b; --c-muted:#667085; --c-surface:#ffffff; --c-radius:10px;
      --c-display-font:Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
      --c-body-font:Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
      /* Not themed, on purpose. A win reads as a win on every demo, and a prospect
         whose brand colour is green still needs a green that means "you got it". */
      --c-ok:#0f7b45;
      font-family:var(--c-body-font);
      width:100%; display:block;
    }
    /* Only when the file is opened on its own, so it can be checked without the
       engine's container around it. */
    body > #dnf-cd { max-width:460px; margin:40px auto; }

    #dnf-cd .card {
      position:relative; width:100%; background:var(--c-surface);
      border-radius:calc(var(--c-radius) + 10px); overflow:hidden;
      border:1px solid color-mix(in srgb, var(--c-ink) 8%, transparent);
      box-shadow:0 24px 60px rgba(20,24,27,.22), 0 2px 6px rgba(20,24,27,.06);
      box-shadow:0 24px 60px color-mix(in srgb, var(--c-ink) 22%, transparent),
                 0 2px 6px color-mix(in srgb, var(--c-ink) 6%, transparent);
      text-align:center; padding:28px 30px 26px;
      animation:dnf-in .3s cubic-bezier(.2,.8,.3,1);
    }
    @keyframes dnf-in { from { opacity:0; transform:translateY(12px) scale(.97); } to { opacity:1; transform:none; } }
    /* The same brand wash the other two games carry at the top edge. */
    #dnf-cd .card::before {
      content:""; position:absolute; left:0; right:0; top:0; height:120px; pointer-events:none;
      background:linear-gradient(180deg,
        color-mix(in srgb, var(--c-primary) 9%, transparent) 0%, transparent 100%);
    }

    #dnf-cd .eyebrow {
      display:inline-block;
      font-size:10.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
      color:var(--c-brand-text);
      background:color-mix(in srgb, var(--c-primary) 10%, transparent);
      border:1px solid color-mix(in srgb, var(--c-primary) 22%, transparent);
      border-radius:999px; padding:5px 12px;
    }
    #dnf-cd h2 {
      margin-top:12px;
      font-family:var(--c-display-font);
      font-size:26px; line-height:1.2; font-weight:700;
      color:var(--c-ink); letter-spacing:-.02em;
    }
    #dnf-cd .lede {
      font-size:14px; line-height:1.5; color:var(--c-muted);
      margin:9px auto 0; max-width:32ch;
    }

    /* ---- the clock: three raised cards in a tinted well ---- */
    /* THE STOCK TEMPLATE PUTS THREE BARE NUMBERS ON ONE FLAT GREY BLOCK. Giving each
       group its own raised card, sunk into a tinted well, is what turns a readout into
       an object. The well is derived from the theme rather than a fixed grey, so it
       belongs to the palette instead of sitting on it. */
    #dnf-cd .clock {
      display:flex; align-items:center; justify-content:center; gap:8px;
      margin-top:20px; padding:14px 14px;
      border-radius:calc(var(--c-radius) + 8px);
      background:
        radial-gradient(120% 140% at 50% 0%,
          color-mix(in srgb, var(--c-primary) 9%, transparent) 0%, transparent 72%),
        color-mix(in srgb, var(--c-ink) 6%, var(--c-surface));
      box-shadow:inset 0 1px 0 color-mix(in srgb, var(--c-ink) 5%, transparent);
    }
    #dnf-cd .unit {
      flex:1 1 0; min-width:0; padding:13px 6px 11px;
      background:var(--c-surface);
      border-radius:calc(var(--c-radius) + 2px);
      border:1px solid color-mix(in srgb, var(--c-ink) 8%, transparent);
      box-shadow:0 2px 6px color-mix(in srgb, var(--c-ink) 8%, transparent);
    }
    #dnf-cd .n {
      display:block;
      font-family:var(--c-display-font);
      /* TABULAR FIGURES ARE THE POINT. Without them a 1 is narrower than a 7, so the
         columns twitch on every tick of the clock. */
      font-variant-numeric:tabular-nums; font-feature-settings:'tnum' 1;
      font-size:33px; font-weight:700; line-height:1; letter-spacing:-.03em;
      color:var(--c-ink);
    }
    #dnf-cd .u {
      display:block; margin-top:7px;
      font-size:9.5px; font-weight:700; letter-spacing:.13em; text-transform:uppercase;
      /* Darker than muted because the label sits on a card inside a tinted well.
         Plain muted measured 4.32:1 on every brand, since none of these colours is
         themed: a near miss that only surfaced once the audit composited properly. */
      color:color-mix(in srgb, var(--c-muted) 82%, var(--c-ink));
    }
    /* TWO DOTS RATHER THAN A COLON GLYPH. A colon inherits the font's own vertical
       placement, which never lines up with a number that is optically centred in its
       own card. Two dots sit exactly where they are put. */
    #dnf-cd .sep {
      flex:0 0 auto; display:flex; flex-direction:column; gap:6px;
      align-items:center; justify-content:center; padding-bottom:14px;
    }
    #dnf-cd .sep i {
      display:block; width:5px; height:5px; border-radius:50%;
      background:color-mix(in srgb, var(--c-primary) 55%, transparent);
    }
    /* A rail under the clock, filling as the time goes. The stock template gives no
       sense of how much of the window is left beyond the digits themselves. */
    /* THE TRACK HAS TO BE VISIBLE EMPTY, or the rail reads as a hairline the moment the
       clock starts and there is nothing for the fill to travel along. 8 percent of ink
       on white is about #ebebec, which disappears next to the clock well above it; 14
       percent with an inset edge gives it a channel to sit in. */
    #dnf-cd .rail {
      height:6px; margin:14px 2px 0; border-radius:999px; overflow:hidden;
      background:color-mix(in srgb, var(--c-ink) 14%, transparent);
      box-shadow:inset 0 1px 2px color-mix(in srgb, var(--c-ink) 16%, transparent);
    }
    #dnf-cd .rail i {
      display:block; height:100%; width:0%; border-radius:999px;
      background:linear-gradient(90deg,
        color-mix(in srgb, var(--c-primary) 70%, var(--c-on-primary)) 0%,
        var(--c-primary) 100%);
      transition:width .96s linear;
    }

    /* ---- the prize ---- */
    #dnf-cd .prize { display:none; margin-top:20px; }
    #dnf-cd .code {
      display:inline-block; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      font-size:17px; font-weight:700; letter-spacing:.06em; color:var(--c-ok);
      background:#e7f6ee; border:1px dashed var(--c-ok); border-radius:8px; padding:10px 18px;
    }
    #dnf-cd .prize small {
      display:block; font-size:11.5px; margin-top:8px;
      color:color-mix(in srgb, var(--c-muted) 85%, var(--c-ink));
    }

    /* ---- the button, sized to its text like the reference ---- */
    #dnf-cd .cta {
      display:inline-block; border:0; cursor:pointer; margin-top:20px;
      background:var(--c-primary); color:var(--c-on-primary);
      border-radius:calc(var(--c-radius) + 2px);
      padding:15px 34px; font-family:inherit; font-size:15px; font-weight:700;
      box-shadow:0 8px 20px color-mix(in srgb, var(--c-primary) 34%, transparent);
      transition:transform .14s cubic-bezier(.2,.8,.3,1), box-shadow .14s, filter .14s;
    }
    #dnf-cd .cta:hover {
      transform:translateY(-2px); filter:brightness(1.05);
      box-shadow:0 12px 26px color-mix(in srgb, var(--c-primary) 42%, transparent);
    }
    #dnf-cd .cta:active { transform:translateY(0); }
    #dnf-cd .cta[disabled] { opacity:.5; cursor:default; transform:none; box-shadow:none; }
    /* DARKER THAN MUTED, BECAUSE THE BUTTON ABOVE IT CASTS A BRAND COLOURED GLOW. The
       CTA carries a 20px shadow in the brand colour, which on a dark brand lands on this
       line and takes the white card down to about #f1f2f4. Plain --c-muted is 4.92:1 on
       pure white, so any wash at all puts it under 4.5. */
    #dnf-cd .foot {
      font-size:11px; margin-top:14px; line-height:1.5;
      color:color-mix(in srgb, var(--c-muted) 82%, var(--c-ink));
    }

    /* ---- the four states ---- */
    #dnf-cd .card[data-state="won"] .clock,
    #dnf-cd .card[data-state="sorry"] .clock,
    #dnf-cd .card[data-state="won"] .lede,
    #dnf-cd .card[data-state="sorry"] .lede { display:none; }
    #dnf-cd .card[data-state="won"] .prize,
    #dnf-cd .card[data-state="sorry"] .prize { display:block; }
    #dnf-cd .card[data-state="won"] .cta,
    #dnf-cd .card[data-state="sorry"] .cta { display:none; }
    #dnf-cd .card[data-state="sorry"] .code { color:var(--c-muted); background:#f6f7f8; border-color:#e4e7ec; }
    #dnf-cd .card[data-state="won"] .rail,
    #dnf-cd .card[data-state="sorry"] .rail { display:none; }
    #dnf-cd .card[data-state="expired"] .n { color:var(--c-muted); }
    #dnf-cd .card[data-state="expired"] .sep i,
    #dnf-cd .card[data-state="expired"] .rail i {
      background:var(--c-muted);
    }
  </style>

  <!-- THE THEME BOOTSTRAP. A 1x1 transparent GIF, so onload always fires and
       onerror covers a policy that refuses a data URI. Both call the same routine
       and it runs once: data-theme-state is set before any work and is the guard.

       IT IS TAKEN OUT OF THE FLOW, and that is not tidiness. An <img> is inline, so
       even a 1x1 one sits on a line box and reserves the line's full height, about
       18px. On a centred popup that is invisible. On a BANNER pinned to the top of
       the viewport it is 18px of nothing above the bar, which reads on screen as a
       gap between the top of the page and the bar, and it also moved the bar's
       bottom edge 18px below where its height said it was. Absolute, zero opacity
       and no pointer events: it still loads, it still fires, it occupies nothing. -->
  <img class="boot" alt="" aria-hidden="true"
       style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"
       src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
       onload="(function(){
    var root=document.getElementById('dnf-cd');
    if(!root){return;}
    if(root.getAttribute('data-theme-state')){return;}
    root.setAttribute('data-theme-state','none');

    var KEYS=['primary','on-primary','brand-text','ink','muted','line','surface',
              'radius','display-font','body-font'];

    function paint(map,how){
      var painted=false,i,v;
      for(i=0;i&lt;KEYS.length;i++){
        v=map[KEYS[i]];
        if(v){root.style.setProperty('--c-'+KEYS[i],v);painted=true;}
      }
      if(painted){root.setAttribute('data-theme-state',how);}
      return painted;
    }

    /* Routes 1 and 2. The same reader for both, because the only difference is
       which document is asked, and asking a cross-origin one throws. */
    function fromDocument(doc){
      var view=doc.defaultView;
      if(!view){return null;}
      var cs=view.getComputedStyle(doc.documentElement),out={},got=false,i,v;
      for(i=0;i&lt;KEYS.length;i++){
        v=cs.getPropertyValue('--'+KEYS[i]).trim();
        if(v){out[KEYS[i]]=v;got=true;}
      }
      return got?out:null;
    }

    /* A theme block, from wherever it came, in this file's own names. */
    function fromTheme(t,how){
      if(!t){return false;}
      var stack=',ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif';
      var done=paint({
        'primary':t.primary,'on-primary':t.onPrimary,'brand-text':t.brandText,
        'ink':t.ink,'muted':t.muted,
        'line':t.line,'surface':t.surface,'radius':t.radius,
        'display-font':t.displayFont?t.displayFont+stack:'',
        'body-font':t.bodyFont?t.bodyFont+stack:''
      },how);
      if(!done){return false;}
      /* NO FONT FILE IS FETCHED. This used to append a Google Fonts link so a popup
         matched the prospect's typeface. Removed 7 August 2026, Salil's call: a
         creative may not depend on a host outside this repository at run time,
         non-negotiable 4, and that was the only request any of these files made.

         The family NAME still arrives and is still set on --c-display-font and
         --c-body-font above, followed by a system stack. So a popup uses the
         prospect's typeface when the browser already has it and falls back to the
         system sans when it does not. Colour, radius and spacing are unaffected,
         and they are what carries the theme. */
      return true;
    }

    var here=fromDocument(document);
    if(here){paint(here,'page');return;}
    try{
      var up=fromDocument(window.parent.document);
      if(up){paint(up,'parent');return;}
    }catch(err){/* cross-origin, which is the normal case for a popup */}

    /* THERE IS NO ROUTE 4 ANY MORE. It fetched demo.config.json relative to
       document.referrer, and it was removed on 7 August 2026 for two reasons that
       both stand on their own.

       It could not work. Chrome's default referrer policy is
       strict-origin-when-cross-origin, so a cross-origin frame is handed the ORIGIN
       and never the path. The route guarded against that by requiring a path before
       fetching, which meant it correctly declined to run every single time rather
       than requesting the wrong URL. Proven against a live demo's network panel.

       And it named an outside host, which non-negotiable 4 does not allow in a
       creative. That was the last such reference in these files.

       Route 3 below replaced it and is what actually works: the page is the only
       thing that knows which demo this is, so the page is asked. */

    /* Route 3. The page is the only thing that knows which demo this is, because the
       referrer policy withheld the path, so the page is asked. */
    function onReply(e){
      if(!e.data||e.data.dnTheme!=='reply'){return;}
      if(root.getAttribute('data-theme-state')!=='none'){return;}
      if(fromTheme(e.data.theme,'message')){
        window.removeEventListener('message',onReply);
      }
    }
    window.addEventListener('message',onReply);

    /* Asked more than once, a little apart, so a popup that renders before the page
       has finished booting still gets an answer. Cheap: a message to a window with no
       listener costs nothing, and the reply handler ignores everything after the
       first. */
    var tries=0;
    function ask(){
      tries++;
      if(root.getAttribute('data-theme-state')!=='none'){return;}
      try{window.parent.postMessage({dnTheme:'request'},'*');}catch(err){}
      if(tries&lt;4){window.setTimeout(ask,180);return;}
      /* Nobody answered after four tries, so this stays on the neutral palette, which
         is a readable creative rather than a broken one. A demo published before the
         parent half of the bridge existed lands here. */
    }
    ask();
  })()"
       onerror="var b=this;b.removeAttribute('onerror');if(b.onload){b.onload();}">

  <!-- THE CLOCK, started the only way a creative can start one: from onload, because
       the panel strips a script block and a timer has no click to hang off.
       window.dnfCdStop is exported so the claim handler can stop it. -->
  <img class="tick" alt="" aria-hidden="true" style="position:absolute;width:0;height:0;opacity:0;pointer-events:none"
       src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
       onload="(function(){
    if(window.dnfCdStarted){return;}
    window.dnfCdStarted=true;
    var TOTAL=600;
    var card=document.getElementById('dnf-cd-card');
    var hh=document.getElementById('dnf-cd-h');
    var mm=document.getElementById('dnf-cd-m');
    var ss=document.getElementById('dnf-cd-s');
    if(!card||!hh||!mm||!ss){return;}
    var left=TOTAL;
    function two(n){return n&lt;10?'0'+n:''+n;}
    var rail=document.getElementById('dnf-cd-rail');
    function paint(){
      hh.textContent=two(Math.floor(left/3600));
      mm.textContent=two(Math.floor(left/60)%60);
      ss.textContent=two(left%60);
      if(rail){rail.style.width=(100-(left/TOTAL)*100).toFixed(1)+'%';}
    }
    paint();
    /* Stopping is exported rather than inferred: the claim handler needs it, and an
       interval still running inside a card nobody is looking at keeps writing to a
       dead iframe. */
    window.dnfCdStop=function(){
      if(window.dnfCdTimer){window.clearInterval(window.dnfCdTimer);window.dnfCdTimer=null;}
    };
    window.dnfCdTimer=window.setInterval(function(){
      left=left-1;
      if(left&lt;0){left=0;}
      paint();
      if(left===0){
        window.dnfCdStop();
        if(card.getAttribute('data-state')==='ready'){
          card.setAttribute('data-state','expired');
          var cta=document.getElementById('dnf-cd-cta');
          if(cta){cta.disabled=true;cta.textContent='This one has expired';}
        }
      }
    },1000);
  })()">

  <div class="card" id="dnf-cd-card" data-state="ready">
    <span class="eyebrow">Time limited</span>
    <h2>Countdown to win</h2>
    <p class="lede">Claim it before the clock runs out and it is applied at checkout.</p>

    <div class="clock" role="timer" aria-live="off">
      <span class="unit"><span class="n" id="dnf-cd-h">00</span><span class="u">hours</span></span>
      <span class="sep" aria-hidden="true"><i></i><i></i></span>
      <span class="unit"><span class="n" id="dnf-cd-m">10</span><span class="u">minutes</span></span>
      <span class="sep" aria-hidden="true"><i></i><i></i></span>
      <span class="unit"><span class="n" id="dnf-cd-s">00</span><span class="u">seconds</span></span>
    </div>
    <div class="rail" aria-hidden="true"><i id="dnf-cd-rail"></i></div>

    <div class="prize">
      <div class="code" id="dnf-cd-code">&nbsp;</div>
      <small id="dnf-cd-msg">Use it at checkout</small>
    </div>

    <button type="button" class="cta" id="dnf-cd-cta"
            onclick="var c=document.getElementById('dnf-cd-card');this.disabled=true;if(window.dnfCdStop){window.dnfCdStop();}Dn.sendClick('countdown-to-win__claim');Dn.getGameWinner().then(function(p){var t=p&amp;&amp;(p.couponCode||p.code||p.prize||p.name||p.title)||'';document.getElementById('dnf-cd-code').textContent=t||'Applied to your basket';c.setAttribute('data-state','won');}).catch(function(){document.getElementById('dnf-cd-code').textContent='Nothing this time';document.getElementById('dnf-cd-msg').textContent='The clock beat the draw';c.setAttribute('data-state','sorry');});">
      Claim my offer
    </button>

    <p class="foot">A demonstration storefront, built for this conversation.</p>
  </div>
</div>

</body>
</html>
