<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo Factory | Spin to win (Dengage panel content)</title>
<!-- =========================================================================
     ONE OF THE SHARED CREATIVES. Paste the whole file into the campaign
     whose trigger name is:

         dengage_demo_spin-to-win

     ===================================================================
     RECOGNISABLY THE PANEL'S MECHANIC, DELIBERATELY NOT ITS DESIGN
     ===================================================================

     Rewritten 7 August 2026. The first attempt at this reproduced the stock builder
     closely, which was the wrong brief: a near copy is worth nothing, because the
     stock template already exists. What has to survive is the ANATOMY, so a prospect
     recognises the capability at a glance:

       a segmented wheel with a label on every slice
       a hub at its centre
       a pointer at twelve o'clock
       one clear call to action

     Everything else is designed rather than copied:

       GRADIENT WEDGES, deep at the hub and light at the rim, angled along each wedge.
         The stock wheel is eight flat fills, which reads as a pie chart
       A DOUBLE RIM: a dark ring with a light inner keyline, so the wheel has an edge
         rather than an outline
       RIM TICKS at every boundary, which is the detail that makes it read as an
         instrument rather than a graphic
       A HALO behind the wheel in the brand colour, tying the object to the theme
         without colouring the slices
       A HUB WITH A BRAND RING around it, and the mark sitting in a recessed disc
       A METALLIC PIN, cap and needle, with a highlight down one side
       AN EYEBROW PILL above the title, brand tinted, which the stock template has no
         equivalent of
       CENTRED COMPOSITION rather than the reference's left aligned copy, and a raised
         button that lifts on hover

     THE SLICE COLOURS ARE FIXED RATHER THAN THEMED, and that is the same decision as
     the scratch foil being foil. A prize wheel is multicoloured the way a roulette
     wheel is: it is what makes the object legible. The brand shows up in the halo, the
     hub ring, the eyebrow and the button.

     AND THEY ARE JEWEL TONES RATHER THAN BRIGHT ONES, which is a readability decision
     before it is an aesthetic one. An earlier revision of this file claimed every
     label had been checked against its wedge's deep stop, "the darkest colour it
     crosses", and cleared 5:1. That reasoning is backwards. White text does not care
     about the darkest colour under it, it cares about the LIGHTEST, and a label spans
     r=42 to r=96 on a gradient that runs deep at the hub to light at the rim: almost
     all of it sits on the light half. Measured against the pixels actually behind the
     glyphs, the eight labels ran from 2.06:1 to 3.45:1, so none of them met the 4.5:1
     this repository holds itself to.

     A wedge bright at one end and deep at the other cannot carry one text colour at
     all: these spanned a 3.6x luminance range, too light for white at the rim and too
     dark for ink at the hub. So each wedge was rescaled to sit entirely in the range
     where white works, keeping a 3.1x gradient within it for surface modelling. The
     worst white contrast anywhere on any wedge is now 5.24:1. The wheel reads deeper
     and richer for it rather than brighter, which is the trade this makes knowingly.
     factory/checks/wheel.mjs measures the geometry; the pixel contrast audit measures
     the colours.

     THE LABELS ARE NOT THE REFERENCE'S. Its read 10% OFF, 20% OFF, 15% OFF, 5% OFF,
     and a shared creative may not name a price (CLAUDE.md 3.7): one campaign serves
     every demo forever and no discount is true on all of them. The prize a prospect
     actually receives comes from the draw.

     ===================================================================
     THE GAME CONTRACT
     ===================================================================

     Dn.getGameWinner() posts to the parent, which calls the coupon draw endpoint, and
     REJECTS AFTER THREE SECONDS if no game or coupon is configured. So there is a
     .catch showing a plain fallback rather than a wheel that spins forever in front of
     a prospect. The prize text comes from the server and is read defensively.
     factory/creatives/gamification/README.md.

     THE SPIN IS CSS. The panel strips a script block, so the handler sets one rotation
     and a transition does the rest. It lands on whole turns plus an offset, so the pin
     never stops exactly on a divider.

     PANEL SETTINGS, handoff 2.2:

       Trigger              Data Layer Event
       Event name           dengage_demo_spin-to-win
       Where to display     /.*/
       Status               Active
       Show every X minutes 1
       Max show count       100
       Layout               Popup, width 420 to 460
       Design               padding 0, transparent background
       Close button         Layout > Close Button > "Add close button to outside"
       Game                 configure the coupon draw, or every spin lands in `sorry`

     NO SCRIPT TAG. CSS scoped under #dnf-spin.
========================================================================== -->
</head>
<body>

<div id="dnf-spin">
  <style>
    #dnf-spin * { margin:0; padding:0; box-sizing:border-box; }
    /* THE NEUTRAL PALETTE. The bootstrap below overwrites these when the page answers
       with a theme. The wheel's own eight colours are not among them, on purpose. */
    #dnf-spin {
      --c-primary:#125cfa; --c-on-primary:#ffffff; --c-brand-text:#125cfa;
      --c-ink:#14181b; --c-muted:#667085; --c-surface:#ffffff; --c-radius:10px;
      --c-display-font:Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
      --c-body-font:Inter,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
      /* Not themed: a win reads as a win on every demo. */
      --c-ok:#0f7b45;
      font-family:var(--c-body-font);
      width:100%; display:block;
    }
    body > #dnf-spin { max-width:440px; margin:40px auto; }

    #dnf-spin .card {
      position:relative; width:100%; overflow:hidden; text-align:center;
      background:var(--c-surface);
      border-radius:calc(var(--c-radius) + 10px);
      border:1px solid color-mix(in srgb, var(--c-ink) 8%, transparent);
      box-shadow:0 24px 60px rgba(20,24,27,.22), 0 2px 6px rgba(20,24,27,.06);
      box-shadow:0 24px 60px color-mix(in srgb, var(--c-ink) 22%, transparent),
                 0 2px 6px color-mix(in srgb, var(--c-ink) 6%, transparent);
      padding:26px 28px 24px;
      animation:dnf-in .3s cubic-bezier(.2,.8,.3,1);
    }
    @keyframes dnf-in { from { opacity:0; transform:translateY(12px) scale(.97); } to { opacity:1; transform:none; } }

    /* A wash of the brand colour at the top edge, so the card belongs to the theme
       before a single word is read. */
    #dnf-spin .card::before {
      content:""; position:absolute; left:0; right:0; top:0; height:132px; pointer-events:none;
      background:linear-gradient(180deg,
        color-mix(in srgb, var(--c-primary) 10%, transparent) 0%, transparent 100%);
    }

    #dnf-spin .stage { position:relative; width:min(280px,100%); margin:2px auto 0; }
    #dnf-spin svg.wheel { display:block; width:100%; height:auto; overflow:visible; }
    /* THE ONLY ANIMATED THING. The handler sets a rotation and the transition carries
       it, because a script block would not survive the panel. */
    #dnf-spin .spin {
      transform-origin:120px 120px;
      transition:transform 3.4s cubic-bezier(.13,.85,.18,1);
    }
    /* THE LABEL BAND IS NARROWER THAN IT LOOKS, so this size and the anchor radius the
       labels sit on are measured rather than chosen.

       Between the hub ring's outer edge and the rim keyline's inner edge there are 59
       units, and the longest label wants most of them. At the original 11.5px on a
       larger hub, three labels ran underneath it. The hub came in to r=38 and the size
       to 10.5px, which leaves the longest about 3 units clear at each end.

       AND THE FONT IS THE PROSPECT'S, WHICH IS THE PART THAT CAUGHT ME OUT. These labels
       render in whatever family the theme carries, so the numbers have to hold for the
       widest of them, not for the one a test machine happens to fall back to. Poppins is
       about 5 units wider than the fallback here: measuring against the fallback made
       the original collision look like 1 unit when it was really 5.
       factory/checks/wheel.mjs measures every label against both boundaries in every
       family the factory can pick. */
    #dnf-spin .wheel text {
      font-family:var(--c-body-font);
      font-size:10.5px; font-weight:700; letter-spacing:.02em;
      text-anchor:middle; dominant-baseline:central;
      paint-order:stroke; stroke:rgba(0,0,0,.16); stroke-width:2.4px; stroke-linejoin:round;
    }

    #dnf-spin .eyebrow {
      display:inline-block; margin:18px 0 0;
      font-size:10.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
      color:var(--c-brand-text);
      background:color-mix(in srgb, var(--c-primary) 10%, transparent);
      border:1px solid color-mix(in srgb, var(--c-primary) 22%, transparent);
      border-radius:999px; padding:5px 12px;
    }
    #dnf-spin h2 {
      font-family:var(--c-display-font);
      font-size:23px; font-weight:700; line-height:1.2; letter-spacing:-.02em;
      color:var(--c-ink); margin-top:11px;
    }
    #dnf-spin .lede {
      font-size:13.5px; line-height:1.55; color:var(--c-muted);
      margin:8px auto 0; max-width:30ch;
    }

    /* The prize, styled as a ticket rather than a plain chip. */
    #dnf-spin .prize { display:none; margin-top:16px; }
    #dnf-spin .code {
      display:inline-block; position:relative;
      font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      font-size:18px; font-weight:700; letter-spacing:.08em; color:var(--c-ok);
      background:#eefaf3; border:1.5px dashed var(--c-ok); border-radius:10px;
      padding:12px 24px;
    }
    #dnf-spin .prize small {
      display:block; font-size:11.5px; margin-top:9px;
      color:color-mix(in srgb, var(--c-muted) 82%, var(--c-ink));
    }

    #dnf-spin .cta {
      display:block; width:100%; border:0; cursor:pointer; margin-top:18px;
      background:var(--c-primary); color:var(--c-on-primary);
      border-radius:calc(var(--c-radius) + 2px);
      padding:15px 18px; font-family:inherit; font-size:15px; font-weight:700;
      letter-spacing:.01em;
      box-shadow:0 8px 20px color-mix(in srgb, var(--c-primary) 34%, transparent);
      transition:transform .14s cubic-bezier(.2,.8,.3,1), box-shadow .14s, filter .14s;
    }
    #dnf-spin .cta:hover {
      transform:translateY(-2px); filter:brightness(1.05);
      box-shadow:0 12px 26px color-mix(in srgb, var(--c-primary) 42%, transparent);
    }
    #dnf-spin .cta:active { transform:translateY(0); }
    #dnf-spin .cta[disabled] { opacity:.5; cursor:default; transform:none; box-shadow:none; }
    /* DARKER THAN MUTED, BECAUSE THE BUTTON ABOVE IT CASTS A BRAND COLOURED GLOW. The
       CTA carries a 20px shadow in the brand colour, which on a dark brand lands on this
       line and takes the white card down to about #f1f2f4. Plain --c-muted is 4.92:1 on
       pure white, so any wash at all puts it under 4.5. */
    #dnf-spin .foot {
      font-size:11px; margin-top:13px; line-height:1.5;
      color:color-mix(in srgb, var(--c-muted) 82%, var(--c-ink));
    }

    #dnf-spin .card[data-state="won"] .lede,
    #dnf-spin .card[data-state="sorry"] .lede { display:none; }
    #dnf-spin .card[data-state="won"] .prize,
    #dnf-spin .card[data-state="sorry"] .prize { display:block; }
    #dnf-spin .card[data-state="won"] .cta,
    #dnf-spin .card[data-state="sorry"] .cta { display:none; }
    #dnf-spin .card[data-state="sorry"] .code {
      color:var(--c-muted); background:#f6f7f8; border-color:#dfe3e8;
    }
  </style>

  <!-- THE THEME BOOTSTRAP. A 1x1 transparent GIF, so onload always fires and
       onerror covers a policy that refuses a data URI. Both call the same routine
       and it runs once: data-theme-state is set before any work and is the guard.

       IT IS TAKEN OUT OF THE FLOW, and that is not tidiness. An <img> is inline, so
       even a 1x1 one sits on a line box and reserves the line's full height, about
       18px. On a centred popup that is invisible. On a BANNER pinned to the top of
       the viewport it is 18px of nothing above the bar, which reads on screen as a
       gap between the top of the page and the bar, and it also moved the bar's
       bottom edge 18px below where its height said it was. Absolute, zero opacity
       and no pointer events: it still loads, it still fires, it occupies nothing. -->
  <img class="boot" alt="" aria-hidden="true"
       style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"
       src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"
       onload="(function(){
    var root=document.getElementById('dnf-spin');
    if(!root){return;}
    if(root.getAttribute('data-theme-state')){return;}
    root.setAttribute('data-theme-state','none');

    var KEYS=['primary','on-primary','brand-text','ink','muted','line','surface',
              'radius','display-font','body-font'];

    function paint(map,how){
      var painted=false,i,v;
      for(i=0;i&lt;KEYS.length;i++){
        v=map[KEYS[i]];
        if(v){root.style.setProperty('--c-'+KEYS[i],v);painted=true;}
      }
      if(painted){root.setAttribute('data-theme-state',how);}
      return painted;
    }

    /* Routes 1 and 2. The same reader for both, because the only difference is
       which document is asked, and asking a cross-origin one throws. */
    function fromDocument(doc){
      var view=doc.defaultView;
      if(!view){return null;}
      var cs=view.getComputedStyle(doc.documentElement),out={},got=false,i,v;
      for(i=0;i&lt;KEYS.length;i++){
        v=cs.getPropertyValue('--'+KEYS[i]).trim();
        if(v){out[KEYS[i]]=v;got=true;}
      }
      return got?out:null;
    }

    /* A theme block, from wherever it came, in this file's own names. */
    function fromTheme(t,how){
      if(!t){return false;}
      var stack=',ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif';
      var done=paint({
        'primary':t.primary,'on-primary':t.onPrimary,'brand-text':t.brandText,
        'ink':t.ink,'muted':t.muted,
        'line':t.line,'surface':t.surface,'radius':t.radius,
        'display-font':t.displayFont?t.displayFont+stack:'',
        'body-font':t.bodyFont?t.bodyFont+stack:''
      },how);
      if(!done){return false;}
      /* NO FONT FILE IS FETCHED. This used to append a Google Fonts link so a popup
         matched the prospect's typeface. Removed 7 August 2026, Salil's call: a
         creative may not depend on a host outside this repository at run time,
         non-negotiable 4, and that was the only request any of these files made.

         The family NAME still arrives and is still set on --c-display-font and
         --c-body-font above, followed by a system stack. So a popup uses the
         prospect's typeface when the browser already has it and falls back to the
         system sans when it does not. Colour, radius and spacing are unaffected,
         and they are what carries the theme. */
      return true;
    }

    var here=fromDocument(document);
    if(here){paint(here,'page');return;}
    try{
      var up=fromDocument(window.parent.document);
      if(up){paint(up,'parent');return;}
    }catch(err){/* cross-origin, which is the normal case for a popup */}

    /* THERE IS NO ROUTE 4 ANY MORE. It fetched demo.config.json relative to
       document.referrer, and it was removed on 7 August 2026 for two reasons that
       both stand on their own.

       It could not work. Chrome's default referrer policy is
       strict-origin-when-cross-origin, so a cross-origin frame is handed the ORIGIN
       and never the path. The route guarded against that by requiring a path before
       fetching, which meant it correctly declined to run every single time rather
       than requesting the wrong URL. Proven against a live demo's network panel.

       And it named an outside host, which non-negotiable 4 does not allow in a
       creative. That was the last such reference in these files.

       Route 3 below replaced it and is what actually works: the page is the only
       thing that knows which demo this is, so the page is asked. */

    /* Route 3. The page is the only thing that knows which demo this is, because the
       referrer policy withheld the path, so the page is asked. */
    function onReply(e){
      if(!e.data||e.data.dnTheme!=='reply'){return;}
      if(root.getAttribute('data-theme-state')!=='none'){return;}
      if(fromTheme(e.data.theme,'message')){
        window.removeEventListener('message',onReply);
      }
    }
    window.addEventListener('message',onReply);

    /* Asked more than once, a little apart, so a popup that renders before the page
       has finished booting still gets an answer. Cheap: a message to a window with no
       listener costs nothing, and the reply handler ignores everything after the
       first. */
    var tries=0;
    function ask(){
      tries++;
      if(root.getAttribute('data-theme-state')!=='none'){return;}
      try{window.parent.postMessage({dnTheme:'request'},'*');}catch(err){}
      if(tries&lt;4){window.setTimeout(ask,180);return;}
      /* Nobody answered after four tries, so this stays on the neutral palette, which
         is a readable creative rather than a broken one. A demo published before the
         parent half of the bridge existed lands here. */
    }
    ask();
  })()"
       onerror="var b=this;b.removeAttribute('onerror');if(b.onload){b.onload();}">

  <div class="card" id="dnf-spin-card" data-state="ready">
    <div class="stage">
      <svg class="wheel" viewBox="0 0 240 240" role="img" aria-label="A prize wheel">
        <defs>
          <linearGradient id="dnf-sw-g0" gradientUnits="userSpaceOnUse" x1="124.6" y1="108.9" x2="158.3" y2="27.6"><stop offset="0" stop-color="#462f7d"/><stop offset="1" stop-color="#7a51d8"/></linearGradient>
          <linearGradient id="dnf-sw-g1" gradientUnits="userSpaceOnUse" x1="131.1" y1="115.4" x2="212.4" y2="81.7"><stop offset="0" stop-color="#024550"/><stop offset="1" stop-color="#04778a"/></linearGradient>
          <linearGradient id="dnf-sw-g2" gradientUnits="userSpaceOnUse" x1="131.1" y1="124.6" x2="212.4" y2="158.3"><stop offset="0" stop-color="#4d3c0b"/><stop offset="1" stop-color="#866814"/></linearGradient>
          <linearGradient id="dnf-sw-g3" gradientUnits="userSpaceOnUse" x1="124.6" y1="131.1" x2="158.3" y2="212.4"><stop offset="0" stop-color="#741e2d"/><stop offset="1" stop-color="#c7334c"/></linearGradient>
          <linearGradient id="dnf-sw-g4" gradientUnits="userSpaceOnUse" x1="115.4" y1="131.1" x2="81.7" y2="212.4"><stop offset="0" stop-color="#1a3d75"/><stop offset="1" stop-color="#2d69cb"/></linearGradient>
          <linearGradient id="dnf-sw-g5" gradientUnits="userSpaceOnUse" x1="108.9" y1="124.6" x2="27.6" y2="158.3"><stop offset="0" stop-color="#0c4822"/><stop offset="1" stop-color="#157c3b"/></linearGradient>
          <linearGradient id="dnf-sw-g6" gradientUnits="userSpaceOnUse" x1="108.9" y1="115.4" x2="27.6" y2="81.7"><stop offset="0" stop-color="#652f09"/><stop offset="1" stop-color="#af510f"/></linearGradient>
          <linearGradient id="dnf-sw-g7" gradientUnits="userSpaceOnUse" x1="115.4" y1="108.9" x2="81.7" y2="27.6"><stop offset="0" stop-color="#6d1d53"/><stop offset="1" stop-color="#bc328f"/></linearGradient>
          <radialGradient id="dnf-sw-halo">
            <stop offset="0" stop-color="var(--c-primary)" stop-opacity=".30"/>
            <stop offset="1" stop-color="var(--c-primary)" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="dnf-sw-hub" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#2b2f39"/><stop offset="1" stop-color="#12141a"/>
          </linearGradient>
          <linearGradient id="dnf-sw-pin" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#e8ebf0"/><stop offset=".45" stop-color="#aab1bd"/>
            <stop offset="1" stop-color="#767d8a"/>
          </linearGradient>
        </defs>

        <!-- The halo, which is what ties a fixed palette wheel to a themed card. -->
        <circle cx="120" cy="120" r="118" fill="url(#dnf-sw-halo)"/>

        <g class="spin" id="dnf-spin-wheel">
          <g stroke="#ffffff" stroke-width="2.6" stroke-linejoin="round">
          <path d="M120.0 120.0 L120.00 20.00 A100.0 100.0 0 0 1 190.71 49.29 Z" fill="url(#dnf-sw-g0)"/>
          <path d="M120.0 120.0 L190.71 49.29 A100.0 100.0 0 0 1 220.00 120.00 Z" fill="url(#dnf-sw-g1)"/>
          <path d="M120.0 120.0 L220.00 120.00 A100.0 100.0 0 0 1 190.71 190.71 Z" fill="url(#dnf-sw-g2)"/>
          <path d="M120.0 120.0 L190.71 190.71 A100.0 100.0 0 0 1 120.00 220.00 Z" fill="url(#dnf-sw-g3)"/>
          <path d="M120.0 120.0 L120.00 220.00 A100.0 100.0 0 0 1 49.29 190.71 Z" fill="url(#dnf-sw-g4)"/>
          <path d="M120.0 120.0 L49.29 190.71 A100.0 100.0 0 0 1 20.00 120.00 Z" fill="url(#dnf-sw-g5)"/>
          <path d="M120.0 120.0 L20.00 120.00 A100.0 100.0 0 0 1 49.29 49.29 Z" fill="url(#dnf-sw-g6)"/>
          <path d="M120.0 120.0 L49.29 49.29 A100.0 100.0 0 0 1 120.00 20.00 Z" fill="url(#dnf-sw-g7)"/>
          </g>
          <text x="146.41" y="56.25" transform="rotate(292.5 146.41 56.25)" fill="#ffffff">Free gift</text>
          <text x="183.75" y="93.60" transform="rotate(337.5 183.75 93.60)" fill="#ffffff">Bonus</text>
          <text x="183.75" y="146.41" transform="rotate(22.5 183.75 146.41)" fill="#ffffff">Reward</text>
          <text x="146.41" y="183.75" transform="rotate(67.5 146.41 183.75)" fill="#ffffff">Extra</text>
          <text x="93.60" y="183.75" transform="rotate(-67.5 93.60 183.75)" fill="#ffffff">Try again</text>
          <text x="56.25" y="146.41" transform="rotate(-22.5 56.25 146.41)" fill="#ffffff">Surprise</text>
          <text x="56.25" y="93.60" transform="rotate(22.5 56.25 93.60)" fill="#ffffff">Big prize</text>
          <text x="93.60" y="56.25" transform="rotate(67.5 93.60 56.25)" fill="#ffffff">Mystery</text>
          <!-- Rim ticks, drawn inside the spinning group so they turn with it. -->
          <g stroke="rgba(255,255,255,.55)" stroke-width="1.6" stroke-linecap="round">
          <line x1="120.00" y1="19.00" x2="120.00" y2="13.00"/>
          <line x1="191.42" y1="48.58" x2="195.66" y2="44.34"/>
          <line x1="221.00" y1="120.00" x2="227.00" y2="120.00"/>
          <line x1="191.42" y1="191.42" x2="195.66" y2="195.66"/>
          <line x1="120.00" y1="221.00" x2="120.00" y2="227.00"/>
          <line x1="48.58" y1="191.42" x2="44.34" y2="195.66"/>
          <line x1="19.00" y1="120.00" x2="13.00" y2="120.00"/>
          <line x1="48.58" y1="48.58" x2="44.34" y2="44.34"/>
          </g>
        </g>

        <!-- A double rim: dark ring, light keyline inside it. data-edge marks the two
             circles a slice label must stay between, so factory/checks/wheel.mjs reads
             the boundaries out of the markup instead of carrying its own copy of them. -->
        <circle cx="120" cy="120" r="105" fill="none" stroke="#17181c" stroke-width="10"/>
        <circle cx="120" cy="120" r="99.4" fill="none" stroke="rgba(255,255,255,.42)"
                stroke-width="1.4" data-edge="rim"/>

        <!-- Hub and pin sit outside the spinning group, so they hold still. The hub is
             deliberately smaller than the labels would allow at their old size: it buys
             the three longest of them the clearance they were missing. -->
        <circle cx="120" cy="120" r="38" fill="none" data-edge="hub"
                stroke="var(--c-primary)" stroke-width="2.8" opacity=".85"/>
        <circle cx="120" cy="120" r="33" fill="url(#dnf-sw-hub)"/>
        <circle cx="120" cy="120" r="28" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="1.2"/>
        <g fill="#ffffff" aria-hidden="true"
           transform="translate(120 120.5) scale(0.9) translate(-120 -120.5)">
          <rect x="104" y="110" width="32" height="9" rx="2.5"/>
          <rect x="107.5" y="119" width="25" height="19" rx="2.5"/>
          <rect x="116.6" y="110" width="6.8" height="28" rx="1.6"/>
          <path d="M120 110c-4-1-9-3-9-7 0-3 4-4 6-2 2 2 3 6 3 9z"/>
          <path d="M120 110c4-1 9-3 9-7 0-3-4-4-6-2-2 2-3 6-3 9z"/>
        </g>

        <!-- The pointer stops at r=88, just inside the rim. It used to reach r=78, which
             is the middle of the label band, so it sat across whichever label was
             passing. Two tones rather than one flat fill, because a needle lit from one
             side reads as a physical part. -->
        <g aria-hidden="true">
          <path d="M120 32 L112.5 10 L127.5 10 Z" fill="#3d434e"/>
          <path d="M120 32 L112.5 10 L120 10 Z" fill="#565d6a"/>
          <rect x="107" y="1" width="26" height="11" rx="5.5" fill="url(#dnf-sw-pin)"/>
        </g>
      </svg>
    </div>

    <span class="eyebrow">One spin, one prize</span>
    <h2>Give the wheel a turn</h2>
    <p class="lede">Whatever it lands on is yours to use today, applied at checkout.</p>

    <div class="prize">
      <div class="code" id="dnf-spin-code">&nbsp;</div>
      <small id="dnf-spin-msg">Use it at checkout</small>
    </div>

    <button type="button" class="cta" id="dnf-spin-cta"
            onclick="var c=document.getElementById('dnf-spin-card'),w=document.getElementById('dnf-spin-wheel');this.disabled=true;w.style.transform='rotate(1327deg)';Dn.sendClick('spin-to-win__spin');Dn.getGameWinner().then(function(p){var t=p&amp;&amp;(p.couponCode||p.code||p.prize||p.name||p.title)||'';document.getElementById('dnf-spin-code').textContent=t||'Applied to your basket';c.setAttribute('data-state','won');}).catch(function(){document.getElementById('dnf-spin-code').textContent='The wheel is resting';document.getElementById('dnf-spin-msg').textContent='Try again shortly';c.setAttribute('data-state','sorry');});">
      Spin the wheel
    </button>

    <p class="foot">A demonstration storefront, built for this conversation.</p>
  </div>
</div>

</body>
</html>
