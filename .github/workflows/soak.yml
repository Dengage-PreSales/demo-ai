name: Soak

# READING REAL STORES, SEPARATELY FROM ANYTHING THAT MATTERS.
#
# factory/soak.mjs reads the addresses in factory/soak.json, which are the real
# requests from the Issues tab including the hard ones, and reports what a demo
# built from each would contain: products, navigable shelves, how much of the
# catalogue fell into the tail group, the theme and the currency. It builds
# nothing and commits nothing.
#
# WHY IT IS NOT PART OF THE DRILL, which is where it started. The drill builds
# two stores end to end on the same runner, and the soak reads ten. Its first
# outing reported four Shopify stores as regressed, and the drill had BUILT two
# of those same stores minutes earlier in that job, sixty products each, every
# check green. The soak had spent whatever budget those stores allow one address
# and then reported the damage as a fault. A routine that degrades the thing it
# is meant to protect is worse than no routine, so the two are separated: a
# different workflow, a different hour, and a few stores a night rather than all
# of them.
#
# IT NEVER FAILS OVER A REFUSAL. A throttled store and a store that genuinely
# refuses automated readers look identical from in here, so neither is judged.
# Only a store that hands over its catalogue and then yields fewer shelves than
# it did before fails, because a throttle cannot cause that and this
# repository's code can.

on:
  schedule:
    # 13:30 UTC, well clear of the drill at 01:30, so the two never share an
    # address within hours of each other.
    - cron: '30 13 * * *'
  workflow_dispatch:
    inputs:
      all:
        description: 'Read every store rather than the few due today'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  soak:
    name: Read real stores
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Read the stores due today
        id: soak
        run: |
          node factory/soak.mjs ${{ inputs.all && '--all' || '' }} --json /tmp/soak.json

      - name: Say what it found
        if: always()
        run: |
          [ -f /tmp/soak.json ] || exit 0
          node -e "
            const rows = require('/tmp/soak.json').rows;
            const bad = rows.filter((r) => r.verdict === 'REGRESSED' || r.verdict === 'error');
            console.log(rows.length + ' store(s) read today, ' + bad.length + ' below what they gave before.');
            for (const r of bad) console.log('  ' + r.url + ': ' + (r.notes || []).join(', '));
          "

      - name: Open an issue about a store that got worse
        if: failure() && steps.soak.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            let rows = []
            try { rows = require('/tmp/soak.json').rows } catch (err) { /* nothing written */ }
            const bad = rows.filter((r) => r.verdict === 'REGRESSED' || r.verdict === 'error')
            if (!bad.length) return
            const runUrl = context.serverUrl + '/' + context.repo.owner + '/'
              + context.repo.repo + '/actions/runs/' + context.runId
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: 'A store the factory used to read properly no longer does: '
                + new Date().toISOString().slice(0, 10),
              labels: ['drill'],
              body: [
                'These stores handed over their catalogues and then produced less',
                'than they did when they were added to factory/soak.json. A store',
                'that simply refused today is not listed here, because a refusal',
                'and a rate limit look the same from inside a run.',
                '',
                ...bad.map((r) => '- ' + r.url + ': ' + (r.notes || []).join(', ')),
                '',
                runUrl,
                '',
                '---',
                '_Generated by [Claude Code](https://claude.ai/code)_'
              ].join('\n')
            })
