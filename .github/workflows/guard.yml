name: Guard

# The CI guardrails, handoff section 11. These run on every change, and one of
# them is the only thing standing between a generated demo and the Dengage
# tables that the core demo sites and the two mobile apps share.
#
# The guard's own test suite runs first and runs always. A guard that passes on
# an empty repository proves nothing (handoff 11.1), so the evidence that these
# checks work is that they reject a tree known to be wrong, on every count.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    name: Guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # THE FULL HISTORY, because one check reads commit dates and the default
          # depth of 1 knows almost none of them.
          #
          # The check is "no push banner is older than the photograph it was made
          # from", and it used to compare file mtimes. mtime does not survive a
          # checkout: a clone stamps every file with the moment it was written, so
          # the order of a photograph and its banner is whatever the checkout
          # happened to do, and it differs every run. That assertion passed on every
          # machine that had generated the banners and failed here on two arbitrary
          # files out of thirty, which held this workflow red across every commit on
          # 10 August 2026 with nothing actually wrong.
          #
          # It now reads git commit dates, which are the same in a clone as they are
          # anywhere else. With a shallow clone it SKIPS and says why rather than
          # guessing, so leaving this out would not turn the workflow red again, it
          # would quietly stop checking.
          fetch-depth: 0

      # Runs before the guard itself. If the checks have stopped working, the
      # result of running them over the repository means nothing, so there is
      # no point reading it.
      # ------------------------------------------------------------- verify
      # EVERY CHECK THAT JUDGES THIS REPOSITORY, and the list is not here.
      #
      # It used to be: fourteen commands written out in this file and nowhere
      # else, so the most a person could run locally was factory/guard/run.sh
      # and "the guard passes" meant one of the fourteen. On 22 September a
      # change passed everything anybody could reasonably run and went red here,
      # on factory/panel/links.test.mjs, which no local command ran.
      #
      # factory/checks/verify-repo.sh is the list now. This calls it and a
      # person calls it, so a check added to it reaches both at once, and the
      # guard's verify-one-list check refuses a workflow that runs these itself.
      # THE SAME NODE THE OTHER FOUR WORKFLOWS PIN. This workflow used to take
      # whatever version the runner happened to ship, which was fine while it
      # ran the guard and a handful of offline suites. It now runs the same list
      # the build runs, and a list that passes on one version and fails on
      # another is the two lists problem again with the lists identical.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # THE BROWSER TOO, because three of the suites in the list below render
      # fixtures served from 127.0.0.1. That is what proves a dark store
      # produces a dark demo, and it is the half of the list that used to be
      # skipped here and run only in the build workflow.
      - name: Install pinned packages and the browser
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Verify the repository
        run: bash factory/checks/verify-repo.sh
